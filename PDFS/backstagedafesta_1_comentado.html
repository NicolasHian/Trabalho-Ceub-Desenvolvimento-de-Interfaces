<!doctype html>
<!-- Declara que este documento usa HTML5 -->
<html lang="pt-BR">
<!-- Abre a tag raiz do HTML e define o idioma como português do Brasil (ajuda leitores de tela e o Google) -->
<head>
<!-- Início da seção "head": metadados que não aparecem na tela, mas configuram a página -->
<meta charset="UTF-8">
<!-- Define a codificação de caracteres como UTF-8, para acentos e caracteres especiais funcionarem -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Faz a página se ajustar à largura da tela do dispositivo (essencial para responsividade em celular) -->
<title>Backstage da Festa</title>
<!-- Título que aparece na aba do navegador -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<!-- Avisa o navegador para já abrir conexão com o Google Fonts antes de precisar, deixando o carregamento mais rápido -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Mesma ideia acima, mas para o domínio que efetivamente hospeda os arquivos de fonte -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Importa três fontes do Google Fonts: Fraunces (títulos), Work Sans (texto normal) e IBM Plex Mono (números/monoespaçada) -->
<style>
  /* Início do bloco de CSS (estilo visual da página) */

  :root {
    /* :root é o elemento HTML como um todo; aqui são criadas "variáveis CSS" (custom properties) reaproveitadas no resto do arquivo */
    --bg: #F5F6F8;              /* cor de fundo da página no tema claro */
    --surface: #FFFFFF;         /* cor de fundo dos "cards"/caixas no tema claro */
    --surface-2: #ECEEF3;       /* uma segunda cor de superfície, um pouco mais escura, para contraste */
    --border: #DBDFE7;          /* cor das bordas dos elementos */
    --ink: #1C2333;             /* cor do texto principal */
    --ink-muted: #5B6478;       /* cor de texto secundário/apagado (legendas, notas) */
    --accent: #7A3B5E;          /* cor de destaque (roxo/vinho) usada em botões ativos, títulos etc. */
    --accent-ink: #ffffff;      /* cor do texto quando ele fica em cima da cor de destaque */
    --accent-soft: #F3E6EC;     /* versão bem clara da cor de destaque, para fundos suaves */
    --gold: #B8791F;            /* cor dourada (reserva, definida mas não necessariamente usada em todo lugar) */
    --success: #2F7D6B;         /* cor de "sucesso" (verde), usada em itens concluídos */
    --success-soft: #E1F1EC;    /* fundo verde clarinho para destacar sucesso */
    --warn: #A5710E;            /* cor de "atenção" (amarelo/laranja escuro) */
    --warn-soft: #FBF1DE;       /* fundo amarelo clarinho para avisos */
    --danger: #A93E35;          /* cor de "perigo" (vermelho), ex.: prazo atrasado */
    --danger-soft: #FBEAE8;     /* fundo vermelho clarinho para perigo */
    --shadow: 0 1px 2px rgba(28,35,51,0.06), 0 8px 24px -12px rgba(28,35,51,0.12);
    /* sombra padrão aplicada aos cards (duas camadas de sombra sobrepostas para dar profundidade) */
    color-scheme: light;
    /* diz ao navegador que o esquema de cores padrão desta página é claro (afeta scrollbars, inputs nativos etc.) */
  }
  @media (prefers-color-scheme: dark) {
    /* Este bloco só se aplica quando o SISTEMA OPERACIONAL do usuário está em modo escuro */
    :root:not([data-theme="light"]) {
      /* Mas só entra em vigor se a página não tiver sido forçada manualmente para o tema "light" via atributo data-theme */
      --bg: #14161D;             /* fundo escuro */
      --surface: #1C2030;        /* superfície escura dos cards */
      --surface-2: #252A3C;      /* segunda superfície escura */
      --border: #383E56;         /* borda no tema escuro */
      --ink: #ECE9E2;            /* texto principal claro (para contrastar com fundo escuro) */
      --ink-muted: #A5ABC2;      /* texto secundário claro */
      --accent: #E29FC0;         /* cor de destaque adaptada (rosa mais claro) para tema escuro */
      --accent-ink: #1C2030;     /* texto escuro em cima do destaque, no tema escuro */
      --accent-soft: #3A2431;    /* fundo suave de destaque no escuro */
      --gold: #E3B15A;           /* dourado ajustado para o escuro */
      --success: #74C7AE;        /* verde ajustado para o escuro */
      --success-soft: #1E362F;   /* fundo verde escuro */
      --warn: #E3B15A;           /* amarelo ajustado para o escuro */
      --warn-soft: #3A2E14;      /* fundo amarelo escuro */
      --danger: #E2897C;         /* vermelho ajustado para o escuro */
      --danger-soft: #3A211F;    /* fundo vermelho escuro */
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
      /* sombra mais forte, porque em fundo escuro sombras claras/fracas não aparecem bem */
      color-scheme: dark;
      /* avisa o navegador que agora o esquema é escuro */
    }
  }
  :root[data-theme="dark"] {
    /* Este bloco força o tema escuro manualmente, mesmo que o sistema operacional esteja no modo claro,
       quando alguém define o atributo data-theme="dark" na tag <html> (ex.: um botão de alternar tema) */
    --bg: #14161D;
    --surface: #1C2030;
    --surface-2: #252A3C;
    --border: #383E56;
    --ink: #ECE9E2;
    --ink-muted: #A5ABC2;
    --accent: #E29FC0;
    --accent-ink: #1C2030;
    --accent-soft: #3A2431;
    --gold: #E3B15A;
    --success: #74C7AE;
    --success-soft: #1E362F;
    --warn: #E3B15A;
    --warn-soft: #3A2E14;
    --danger: #E2897C;
    --danger-soft: #3A211F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
    color-scheme: dark;
    /* (mesmos valores do bloco de dark mode automático acima, repetidos para o modo forçado manualmente) */
  }

  * { box-sizing: border-box; }
  /* Aplica a TODOS os elementos: padding e borda passam a contar dentro da largura/altura definida (evita contas confusas de tamanho) */
  html, body { margin: 0; padding: 0; }
  /* Remove a margem e o espaçamento padrão que o navegador coloca em html e body */
  body {
    background: var(--bg);           /* usa a variável de cor de fundo definida acima */
    color: var(--ink);               /* cor do texto padrão do corpo da página */
    font-family: 'Work Sans', system-ui, -apple-system, Segoe UI, sans-serif;
    /* fonte principal do texto, com alternativas (fallbacks) caso a Work Sans não carregue */
    font-size: 15px;                 /* tamanho de fonte base */
    line-height: 1.5;                /* espaçamento entre linhas de texto (150% do tamanho da fonte) */
    overflow-x: hidden;              /* esconde qualquer rolagem horizontal indesejada */
  }
  @media (prefers-reduced-motion: reduce) {
    /* Se o usuário configurou o sistema para reduzir animações (acessibilidade)... */
    * { transition: none !important; animation: none !important; }
    /* ...desativa TODAS as transições e animações CSS da página */
  }

  .wrap {
    max-width: 920px;   /* largura máxima do conteúdo, para não esticar demais em telas grandes */
    margin: 0 auto;      /* centraliza horizontalmente o bloco na página */
    padding: 28px 20px 64px;  /* espaçamento interno: topo 28px, laterais 20px, base 64px */
  }

  /* ---------- header ---------- */
  header.top {
    display: flex;              /* transforma o header em um container flexível */
    flex-direction: column;     /* empilha os filhos na vertical */
    gap: 18px;                  /* espaço de 18px entre os filhos */
    margin-bottom: 26px;        /* espaço abaixo do header inteiro */
  }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;  /* usa a fonte monoespaçada para esse rótulo pequeno */
    font-size: 11.5px;                        /* tamanho bem pequeno */
    letter-spacing: 0.09em;                   /* espaçamento extra entre letras */
    text-transform: uppercase;                /* força o texto em maiúsculas */
    color: var(--accent);                     /* usa a cor de destaque */
    font-weight: 500;                         /* peso da fonte (meio-negrito) */
  }
  h1.title {
    font-family: 'Fraunces', Georgia, serif;  /* fonte serifada de destaque para o título principal */
    font-weight: 600;                         /* semi-negrito */
    font-size: clamp(28px, 5vw, 38px);        /* tamanho responsivo: nunca menor que 28px, nunca maior que 38px, e tenta 5% da largura da tela */
    margin: 4px 0 0;                          /* margem só no topo */
    text-wrap: balance;                       /* tenta equilibrar o texto em várias linhas de forma mais bonita */
    letter-spacing: -0.01em;                  /* letras levemente mais próximas umas das outras */
  }
  .subtitle {
    color: var(--ink-muted);   /* cor apagada para o subtítulo */
    font-size: 14px;           /* tamanho um pouco menor que o texto padrão */
    margin-top: 2px;           /* pequena margem no topo */
  }

  .status-row {
    display: grid;                          /* usa grid layout para os dois cards de status */
    grid-template-columns: 1.3fr 1fr;       /* duas colunas: a primeira um pouco mais larga que a segunda */
    gap: 12px;                              /* espaço entre as colunas */
  }
  @media (max-width: 560px) {
    /* Em telas estreitas (celular)... */
    .status-row { grid-template-columns: 1fr; }
    /* ...os dois cards passam a ficar em uma coluna só (empilhados) */
  }
  .status-card {
    background: var(--surface);   /* fundo do card */
    border: 1px solid var(--border);  /* borda fina */
    border-radius: 12px;          /* cantos arredondados */
    padding: 16px 18px;           /* espaçamento interno */
    box-shadow: var(--shadow);    /* aplica a sombra definida nas variáveis */
  }
  .status-card .label {
    font-size: 11.5px;                 /* rótulo pequeno dentro do card */
    text-transform: uppercase;         /* maiúsculas */
    letter-spacing: 0.07em;            /* espaçamento entre letras */
    color: var(--ink-muted);           /* cor apagada */
    font-weight: 600;                  /* semi-negrito */
    margin-bottom: 8px;                /* espaço abaixo do rótulo */
  }
  .overall-num {
    display: flex;                      /* alinha o número grande e o texto pequeno lado a lado */
    align-items: baseline;              /* alinha pela linha de base do texto, ficando visualmente natural */
    gap: 8px;                           /* espaço entre eles */
    font-family: 'IBM Plex Mono', monospace;  /* fonte monoespaçada para números */
    font-variant-numeric: tabular-nums; /* faz os dígitos terem sempre a mesma largura (não "pulam" ao mudar) */
  }
  .overall-num .big { font-size: 26px; font-weight: 500; color: var(--ink); }
  /* número grande da porcentagem geral */
  .overall-num .small { font-size: 13px; color: var(--ink-muted); }
  /* texto pequeno ao lado (ex.: "3 de 10 itens") */
  .bar-track {
    margin-top: 10px;         /* espaço acima da barra */
    height: 8px;               /* altura da barra de progresso (o "trilho" vazio) */
    border-radius: 5px;        /* cantos arredondados */
    background: var(--surface-2);  /* cor de fundo do trilho (parte não preenchida) */
    overflow: hidden;          /* garante que o preenchimento não vaze das bordas arredondadas */
  }
  .bar-fill {
    height: 100%;              /* preenche toda a altura do trilho */
    background: var(--accent); /* cor da parte preenchida (progresso já feito) */
    border-radius: 5px;        /* cantos arredondados */
    transition: width 0.35s ease;  /* anima suavemente quando a largura (o progresso) muda */
  }
  .deadline-body { display: flex; align-items: center; gap: 12px; }
  /* organiza o "chip" de dias restantes e o texto do prazo lado a lado, centralizados verticalmente */
  .deadline-chip {
    font-family: 'IBM Plex Mono', monospace;   /* fonte monoespaçada para o número de dias */
    font-variant-numeric: tabular-nums;        /* dígitos de largura fixa */
    font-size: 22px;                           /* tamanho grande, chama atenção */
    font-weight: 500;                          /* peso médio */
    border-radius: 10px;                       /* cantos arredondados, formato de "pílula/chip" */
    padding: 6px 12px;                         /* espaçamento interno */
    line-height: 1;                            /* linha justa, sem espaço extra vertical */
    white-space: nowrap;                       /* não deixa o texto quebrar linha */
  }
  .deadline-chip.ok { background: var(--success-soft); color: var(--success); }
  /* estilo do chip quando o prazo ainda está tranquilo (verde) */
  .deadline-chip.warn { background: var(--warn-soft); color: var(--warn); }
  /* estilo do chip quando o prazo está próximo (amarelo) */
  .deadline-chip.danger { background: var(--danger-soft); color: var(--danger); }
  /* estilo do chip quando o prazo já passou (vermelho) */
  .deadline-text { font-size: 13.5px; color: var(--ink-muted); }
  /* texto ao lado do chip (nome do módulo e data), em cor apagada */
  .deadline-text b { color: var(--ink); font-weight: 600; }
  /* dentro desse texto, o que estiver em negrito (<b>) usa a cor principal, não a apagada */
  .all-done { color: var(--success); font-weight: 600; font-size: 14.5px; }
  /* estilo da mensagem exibida quando não há nenhuma entrega pendente */

  /* ---------- tabs ---------- */
  .tabs {
    display: flex;               /* as abas ficam lado a lado */
    gap: 6px;                    /* pequeno espaço entre as abas */
    flex-wrap: wrap;             /* se não couber, as abas quebram para a linha de baixo */
    margin-bottom: 18px;         /* espaço abaixo do conjunto de abas */
    border-bottom: 1px solid var(--border);  /* linha divisória abaixo das abas */
    padding-bottom: 12px;        /* espaço entre as abas e essa linha */
  }
  .tab-btn {
    font-family: 'Work Sans', sans-serif;  /* fonte do texto do botão de aba */
    font-size: 13.5px;                      /* tamanho do texto */
    font-weight: 600;                       /* semi-negrito */
    color: var(--ink-muted);                /* cor padrão (aba não selecionada) */
    background: transparent;                /* sem fundo por padrão */
    border: 1px solid transparent;          /* borda invisível (reserva espaço, evita "pulo" de layout) */
    border-radius: 999px;                   /* valor bem alto = formato de pílula/cápsula */
    padding: 7px 14px;                      /* espaçamento interno do botão */
    cursor: pointer;                        /* mostra a mãozinha ao passar o mouse, indicando que é clicável */
    display: inline-flex;                   /* permite alinhar ícone/texto/contador na mesma linha */
    align-items: center;                    /* centraliza verticalmente o conteúdo do botão */
    gap: 7px;                               /* espaço entre a bolinha, o texto e o contador */
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    /* anima suavemente mudanças de fundo, cor de texto e cor de borda (ex.: ao passar o mouse) */
  }
  .tab-btn:hover { background: var(--surface-2); color: var(--ink); }
  /* ao passar o mouse por cima da aba, muda o fundo e escurece o texto */
  .tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* quando o botão recebe foco pelo teclado (Tab), mostra um contorno visível de acessibilidade */
  .tab-btn[aria-selected="true"] {
    background: var(--accent);   /* aba ativa recebe a cor de destaque como fundo */
    color: var(--accent-ink);    /* e o texto muda para a cor que contrasta com o destaque */
  }
  .tab-count {
    font-family: 'IBM Plex Mono', monospace;   /* fonte monoespaçada para o contador "x/y" */
    font-size: 11px;                            /* texto pequeno */
    font-variant-numeric: tabular-nums;         /* dígitos de largura fixa */
    opacity: 0.85;                              /* levemente transparente, para não competir com o texto principal */
  }
  .tab-dot {
    width: 6px; height: 6px; border-radius: 50%;  /* uma bolinha pequena e redonda */
    background: var(--ink-muted);                  /* cor padrão da bolinha (módulo incompleto) */
    flex: none;                                     /* não deixa a bolinha encolher/crescer no flex */
  }
  .tab-btn[data-complete="true"] .tab-dot { background: var(--success); }
  /* se o atributo data-complete da aba for "true" (módulo 100% concluído), a bolinha fica verde */
  .tab-btn[aria-selected="true"] .tab-dot { background: var(--accent-ink); }
  /* se a aba estiver selecionada, a bolinha usa a cor de contraste do destaque (para continuar visível no fundo colorido) */

  /* ---------- panel ---------- */
  .panel-head {
    display: flex;                     /* título do painel e metadados lado a lado */
    flex-wrap: wrap;                   /* quebra linha se não couber */
    align-items: baseline;             /* alinha pela linha de base do texto */
    justify-content: space-between;    /* empurra um para a esquerda e outro para a direita */
    gap: 10px;                         /* espaço mínimo entre eles */
    margin-bottom: 6px;                /* espaço abaixo do cabeçalho do painel */
  }
  h2.panel-title {
    font-family: 'Fraunces', Georgia, serif;  /* mesma fonte serifada do título principal */
    font-size: 22px;                          /* tamanho do título do módulo/aba ativa */
    font-weight: 600;                         /* semi-negrito */
    margin: 0;                                /* remove margem padrão do h2 */
  }
  .panel-meta {
    font-family: 'IBM Plex Mono', monospace;  /* fonte monoespaçada para os metadados (peso da nota, prazo) */
    font-size: 12px;                           /* texto pequeno */
    color: var(--ink-muted);                   /* cor apagada */
    font-variant-numeric: tabular-nums;        /* dígitos de largura fixa */
  }
  .panel-progress-row {
    display: flex;             /* barra de progresso e porcentagem lado a lado */
    align-items: center;       /* centralizados verticalmente */
    gap: 10px;                 /* espaço entre eles */
    margin: 10px 0 22px;       /* margem acima e abaixo dessa linha */
  }
  .panel-progress-row .bar-track { flex: 1; margin-top: 0; }
  /* a barra ocupa todo o espaço disponível e não usa a margem-topo padrão nesse contexto */
  .panel-progress-row .pct {
    font-family: 'IBM Plex Mono', monospace;   /* fonte monoespaçada para a porcentagem */
    font-size: 12.5px;                          /* texto pequeno */
    color: var(--ink-muted);                    /* cor apagada */
    font-variant-numeric: tabular-nums;         /* dígitos de largura fixa */
    white-space: nowrap;                        /* não quebra linha */
  }

  .group { margin-bottom: 22px; }
  /* espaço abaixo de cada grupo de itens dentro de um módulo */
  .group-title {
    font-size: 11.5px;                 /* título do grupo, pequeno */
    text-transform: uppercase;         /* maiúsculas */
    letter-spacing: 0.07em;            /* espaçamento entre letras */
    font-weight: 600;                  /* semi-negrito */
    color: var(--accent);              /* cor de destaque */
    margin-bottom: 8px;                /* espaço abaixo do título do grupo */
  }
  ul.checklist { list-style: none; margin: 0; padding: 0; }
  /* remove as bolinhas padrão de lista e as margens/paddings padrão da <ul> */
  .item {
    background: var(--surface);        /* fundo de cada item da checklist */
    border: 1px solid var(--border);   /* borda fina */
    border-radius: 10px;               /* cantos arredondados */
    margin-bottom: 8px;                /* espaço entre um item e o próximo */
    transition: background 0.15s ease, border-color 0.15s ease;
    /* anima suavemente a mudança de fundo/borda (ex.: quando marcado como concluído) */
  }
  .item:has(input:checked) { background: var(--success-soft); border-color: transparent; }
  /* :has() é um seletor CSS moderno: se o item CONTÉM um checkbox marcado, o próprio item ganha fundo verde suave */
  .item label {
    display: flex;              /* ícone do checkbox e texto lado a lado */
    align-items: flex-start;    /* alinhados pelo topo (útil quando o texto tem duas linhas: título + nota) */
    gap: 11px;                  /* espaço entre checkbox e texto */
    padding: 11px 14px;         /* espaçamento interno clicável do item inteiro */
    cursor: pointer;            /* toda a label é clicável, não só o quadradinho */
  }
  .item input[type="checkbox"] {
    width: 18px; height: 18px;       /* tamanho do quadradinho de marcar */
    margin-top: 2px;                  /* pequeno ajuste para alinhar com a primeira linha do texto */
    accent-color: var(--success);     /* cor do checkbox quando marcado (verde) */
    flex: none;                       /* não deixa o checkbox esticar/encolher */
    cursor: pointer;                  /* mãozinha ao passar o mouse */
  }
  .item input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* contorno de acessibilidade visível quando o checkbox recebe foco via teclado */
  .item-text { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  /* a coluna de texto ocupa o espaço restante e empilha título + nota verticalmente */
  .item-text .main { display: block; font-size: 14px; color: var(--ink); }
  /* texto principal da tarefa */
  .item:has(input:checked) .item-text .main { text-decoration: line-through; color: var(--ink-muted); }
  /* se o checkbox do item estiver marcado, risca o texto principal e apaga a cor (efeito "tarefa concluída") */
  .item-text .note { display: block; font-size: 12.5px; color: var(--ink-muted); }
  /* texto da nota/observação, menor e mais apagado que o texto principal */

  .readonly-banner {
    background: var(--warn-soft);   /* fundo amarelo suave */
    color: var(--warn);             /* texto na cor de aviso */
    border-radius: 10px;            /* cantos arredondados */
    padding: 10px 14px;             /* espaçamento interno */
    font-size: 13px;                /* tamanho do texto */
    margin-bottom: 16px;            /* espaço abaixo do aviso */
  }
  /* estilo do aviso mostrado quando a página está em modo "somente leitura" */

  footer.foot {
    margin-top: 34px;                        /* espaço acima do rodapé */
    padding-top: 14px;                       /* espaço interno acima do texto do rodapé */
    border-top: 1px solid var(--border);     /* linha divisória acima do rodapé */
    font-size: 12px;                         /* texto pequeno */
    color: var(--ink-muted);                 /* cor apagada */
  }
</style>
<!-- Fim do bloco de estilos -->
</head>
<body>
<!-- Início do corpo visível da página -->
<div class="wrap"><div id="app"></div></div>
<!-- .wrap centraliza e limita a largura do conteúdo; #app é o "contêiner vazio" onde o JavaScript vai
     desenhar (renderizar) todo o HTML da checklist dinamicamente -->

<script id="app-script">
// Início do bloco de JavaScript. Tem um id porque o próprio script lê o seu texto depois,
// para gerar uma nova versão do arquivo com o estado salvo embutido
(function () {
  // Cria uma "IIFE" (função que roda imediatamente ao ser definida). Isso evita que as variáveis
  // e funções aqui dentro "vazem" e conflitem com outras variáveis globais da página.
  "use strict";

              // Verifica se esse item já está marcado como concluído.
              return '<li class="item"><label>' +
                '<input type="checkbox" data-id="' + it.id + '" ' + (checked ? "checked" : "") + (readOnly ? " disabled" : "") + '>' +
                // Cria o checkbox: guarda o id do item em data-id, marca "checked" se já estiver concluído,
                // e adiciona "disabled" (desabilitado) se a página estiver em modo somente-leitura.
                '<span class="item-text"><span class="main">' + escapeHtml(it.text) + '</span>' +
                (it.note ? '<span class="note">' + escapeHtml(it.note) + '</span>' : '') +
                // Mostra o texto principal da tarefa e, se existir, a nota explicativa abaixo.
                '</span></label></li>';
            }).join("") +
          '</ul>' +
        '</div>';
      }).join("") +
      // Junta o HTML de todos os grupos desse módulo.
    '</section>';
  }

  function renderApp(state, active) {
    // Função "mestre" de renderização: monta a página inteira (cabeçalho + abas + painel + rodapé) como uma única string HTML.
    var mod = MODULES.filter(function (m) { return m.id === active; })[0] || MODULES[0];
    // Encontra o módulo cujo id bate com "active"; se não encontrar (ou não houver ativo), usa o primeiro módulo como reserva.
    return renderHeader(state) + renderTabs(state, mod.id) + renderPanel(mod, state) +
      '<footer class="foot">Marcações salvas automaticamente neste painel' + (persistMode === "local" ? " (somente neste navegador)" : "") + '.</footer>';
      // Junta cabeçalho + abas + painel do módulo ativo + rodapé (que avisa se o salvamento é só local a este navegador).
  }

  function buildScriptSrc(state) {
    // Gera o novo texto do <script> substituindo o estado salvo (STATE) pelo estado atual, dentro do código-fonte.
    var scriptEl = document.getElementById("app-script");
    // Pega de volta a própria tag <script> pelo id definido no HTML.
    var src = scriptEl ? scriptEl.textContent : "";
    // Lê o conteúdo de texto (código) desse script; se não achar, usa string vazia.
    var json = JSON.stringify(state);
    // Converte o objeto de estado (quais itens estão marcados) em uma string JSON.
    return src.replace(/\/\*STATE_START\*\/[\s\S]*?\/\*STATE_END\*\//, "/*STATE_START*/" + json + "/*STATE_END*/");
    // Usa uma expressão regular para localizar o trecho entre os marcadores /*STATE_START*/ ... /*STATE_END*/
    // e substitui pelo novo JSON, mantendo os marcadores — é assim que o progresso fica "gravado" no próprio arquivo.
  }

  function buildFullHTML(state) {
    // Monta o arquivo HTML completo (do zero) para salvar/publicar, incluindo o <head> original e o script atualizado.
    return "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n" + HEAD_HTML + "\n</head>\n<body>\n" +
      "<div class=\"wrap\"><div id=\"app\"></div></div>\n" +
      "<script id=\"app-script\">" + buildScriptSrc(state) + "<\/script>\n" +
      // O "<\/script>" usa barra invertida antes de "/script" para não fechar acidentalmente
      // a tag <script> que já está envolvendo este próprio código.
      "</body>\n</html>";
  }

  function rerender() {
    // Redesenha toda a interface: substitui o conteúdo da div #app pelo HTML gerado a partir do estado e aba atuais.
    document.getElementById("app").innerHTML = renderApp(STATE, activeTab);
  }

  function handleClick(e) {
    // Trata cliques dentro da área do app — usado para detectar clique nas abas.
    var tabBtn = e.target.closest(".tab-btn");
    // Procura, a partir do elemento clicado, o botão de aba mais próximo (caso o clique tenha sido num filho do botão).
    if (tabBtn) {
      // Se o clique foi realmente em (ou dentro de) um botão de aba...
      activeTab = tabBtn.getAttribute("data-tab");
      // ...atualiza qual é a aba ativa, lendo o id salvo no atributo data-tab.
      rerender();
      // Redesenha a página para mostrar o painel da nova aba selecionada.
    }
  }

  function handleChange(e) {
    // Trata o evento "change" (mudança de valor) — usado para detectar quando um checkbox é marcado/desmarcado.
    var box = e.target;
    if (box.tagName !== "INPUT" || box.type !== "checkbox") return;
    // Se o elemento que mudou não for um checkbox, ignora (sai da função sem fazer nada).
    var id = box.getAttribute("data-id");
    if (!id || readOnly) return;
    // Se o checkbox não tiver um id de item associado, ou se a página estiver em modo somente-leitura, ignora.
    var newState = Object.assign({}, STATE);
    // Cria uma CÓPIA do objeto STATE (Object.assign com objeto vazio como destino), para não alterar o original diretamente.
    newState[id] = box.checked;
    // Na cópia, atualiza o item marcado/desmarcado com o novo valor (true ou false).
    STATE = newState;
    // Substitui o STATE global pela nova versão já atualizada.
    rerender();
    // Redesenha a tela imediatamente, refletindo a marcação feita.
    saveState(newState);
    // Dispara o salvamento do novo estado (localStorage ou Artifact, dependendo do modo).
  }

  function saveState(newState) {
    // Salva o estado atualizado no destino apropriado, conforme o "persistMode" configurado.
    if (persistMode === "artifact" && artifactApi) {
      // Se o modo de persistência é "artifact" e a API está disponível...
      artifactApi.publish(buildFullHTML(newState)).catch(function (err) {
        // Tenta publicar uma nova versão do HTML completo (com o estado atualizado) como Artifact.
        // Se a publicação falhar (Promise rejeitada), trata o erro:
        if (err && (err.code === "not_writer" || err.code === "not_granted")) {
          // Se o erro indica que o usuário não tem permissão de escrita/edição...
          readOnly = true;
          rerender();
          // ...trava a página em modo somente-leitura e redesenha (mostrando o aviso correspondente).
        }
        // conflict / other codes: the view reloads to the winning version, or is transient — no action needed
        // (comentário original do autor: para outros tipos de erro — como conflito de versões —
        // a própria visualização será recarregada com a versão vencedora, ou é um erro passageiro; nada a fazer aqui)
      });
    } else if (persistMode === "local") {
      // Se o modo é "local" (sem Artifact disponível)...
      try { localStorage.setItem("backstage-da-festa-state", JSON.stringify(newState)); } catch (e) {}
      // ...tenta salvar o estado como JSON no localStorage do navegador, sob essa chave.
      // O try/catch evita quebrar a página caso o navegador bloqueie o localStorage (ex.: modo anônimo restrito).
    }
  }

  function initPersistence() {
    // Decide, ao carregar a página, ONDE o progresso será salvo: tenta usar a API de Artifact do Claude;
    // se não existir, cai para o armazenamento local do navegador.
    if (window.claude && typeof window.claude.use === "function") {
      // Se existir o objeto global "window.claude" com uma função "use"...
      window.claude.use("artifact").then(function (api) {
        // ...pede acesso à funcionalidade "artifact" (permite publicar novas versões deste HTML).
        if (api) {
          // Se a API foi concedida com sucesso...
          artifactApi = api;
          persistMode = "artifact";
          // ...guarda a referência e define o modo de persistência como "artifact".
        } else {
          fallbackToLocal();
          // Se não veio uma API válida, usa o armazenamento local como alternativa.
        }
      }).catch(fallbackToLocal);
      // Se a promessa "use" falhar (erro/rejeição), também cai para o armazenamento local.
    } else {
      fallbackToLocal();
      // Se "window.claude" nem existir (ex.: página aberta fora do ambiente do Claude), usa localStorage direto.
    }
  }

  function fallbackToLocal() {
    // Ativa o modo de persistência local e tenta recuperar um estado salvo anteriormente no navegador.
    persistMode = "local";
    try {
      var saved = localStorage.getItem("backstage-da-festa-state");
      // Busca no localStorage se já existe um estado salvo sob essa chave.
      if (saved) {
        STATE = Object.assign({}, STATE, JSON.parse(saved));
        // Se existir, mescla o estado salvo por cima do estado inicial (o salvo tem prioridade),
        // preservando itens que não estavam no JSON salvo, se houver algum caso assim.
        rerender();
        // Redesenha a tela já com o progresso recuperado.
      }
    } catch (e) {}
    // Ignora silenciosamente qualquer erro (ex.: JSON inválido, localStorage bloqueado).
  }

  activeTab = defaultActiveTab(STATE);
  // Define a aba inicial: a primeira que ainda tem pendências (ou a primeira de todas, se tudo estiver completo).
  document.getElementById("app").addEventListener("click", handleClick);
  // Registra o ouvinte de cliques na div #app, delegando o tratamento de clique nas abas para handleClick.
  document.getElementById("app").addEventListener("change", handleChange);
  // Registra o ouvinte de mudanças (marcar/desmarcar checkbox) na div #app, delegando para handleChange.
  rerender();
  // Faz a primeira renderização da página, desenhando tudo pela primeira vez.
  initPersistence();
  // Inicializa o sistema de salvamento (Artifact ou localStorage), podendo recarregar progresso salvo.
})();
// Fecha e executa imediatamente a função anônima definida no início (a IIFE).
</script>
<!-- Fim do bloco de JavaScript -->
</body>
</html>
